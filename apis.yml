description: 'Heart Aerospace is a hybrid-electric aircraft manufacturer founded in
  2019 and headquartered in Torrance / Los Angeles, California, working to decarbonize
  and lower the cost of regional air travel. The company is developing the X1, a full-scale
  hybrid-electric technology demonstrator, and the ES-30, a 30-seat regional production
  aircraft, backed by strategic airline partners including United Airlines and Air
  Canada and investors such as Breakthrough Energy Ventures, Lowercarbon Capital,
  EQT Ventures, and Y Combinator. Heart Aerospace publishes no public developer or
  API surface; this profile tracks the company as an API Evangelist network entry
  in the sustainable-transport sector.'
